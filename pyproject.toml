[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkparse"
version = "0.2.0"
description = "CPU-first document parsing service powered by OpenDataLoader, RapidOCR and Mammoth"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "celery[redis]>=5.4,<6",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "gunicorn>=23,<24",
  "lxml>=5,<7",
  "mammoth>=1.6,<2",
  "onnxruntime>=1.20,<2",
  "opendataloader-pdf>=2,<3",
  "oss2>=2.19,<3",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pymysql>=1.1,<2",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "rapidocr>=3.8,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/engines/docx_math/latex_dict.py" = ["ALL"]
"app/engines/docx_math/omml.py" = ["ALL"]
"tests/docx_factory.py" = ["E501"]
